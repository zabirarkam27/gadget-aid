name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        app: [gadget-aid-client, gadget-aid-server]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - if: matrix.app == 'gadget-aid-client'
        run: npm run lint && npm run build
      - if: matrix.app == 'gadget-aid-server'
        name: Start disposable transaction database
        run: |
          docker run --name gadgetaid-ci-mongo -p 127.0.0.1:27028:27017 -d mongo:8 --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec gadgetaid-ci-mongo mongosh --quiet --eval 'db.adminCommand({ping:1})' >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec gadgetaid-ci-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for attempt in $(seq 1 30); do
            if docker exec gadgetaid-ci-mongo mongosh --quiet --eval 'if(!db.hello().isWritablePrimary)quit(1)' >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          exit 1
      - if: matrix.app == 'gadget-aid-server'
        run: npm run test:mongo
